; Tiny386 diagnostic mode: the original automated configuration (serial/0x402
; output, scripted and PS/2 sessions). Unchanged from the R9 configuration;
; boot disk on hda (IDE primary master), FAT16 volume on hdb (primary slave).
[pc]
bios = bios.bin
vga_bios = vgabios.bin
mem_size = 8M
hda = hda.img
hdb = hdb.img

[cpu]
fpu = 1
